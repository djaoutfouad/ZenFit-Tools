<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldHexOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="75%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="goldHexInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <radialGradient id="hexBackground" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="70%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <linearGradient id="goldBars" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <linearGradient id="goldHelix" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="20%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Hexagon Base Background -->
  <path
    d="M 50 5.5 Q 53 7 83.5 24.5 Q 87 26.5 87 31 L 87 69 Q 87 73.5 83.5 75.5 L 53 93 Q 50 94.5 47 93 L 16.5 75.5 Q 13 73.5 13 69 L 13 31 Q 13 26.5 16.5 24.5 L 47 7 Q 50 5.5 50 5.5 Z"
    fill="url(#hexBackground)"
  />

  <!-- Background Rising Bar Chart -->
  <g opacity="0.85">
    <rect x="20" y="58" width="3.2" height="15" rx="1.2" fill="url(#goldBars)" />
    <rect x="25.5" y="50" width="3.2" height="23" rx="1.2" fill="url(#goldBars)" />
    <rect x="31" y="42" width="3.2" height="31" rx="1.2" fill="url(#goldBars)" />
    <rect x="36.5" y="34" width="3.2" height="39" rx="1.2" fill="url(#goldBars)" />

    <rect x="60.3" y="34" width="3.2" height="39" rx="1.2" fill="url(#goldBars)" />
    <rect x="65.8" y="42" width="3.2" height="31" rx="1.2" fill="url(#goldBars)" />
    <rect x="71.3" y="50" width="3.2" height="23" rx="1.2" fill="url(#goldBars)" />
    <rect x="76.8" y="58" width="3.2" height="15" rx="1.2" fill="url(#goldBars)" />
  </g>

  <!-- Central Bidirectional Arrow & DNA Helix -->
  <g filter="url(#goldGlow)">
    <polygon points="50,9 43,19 47.2,18.5 47.2,25 52.8,25 52.8,18.5 57,19" fill="url(#goldHelix)" />
    <polygon points="50,91 43,81 47.2,81.5 47.2,75 52.8,75 52.8,81.5 57,81" fill="url(#goldHelix)" />

    <line x1="50" y1="23" x2="50" y2="77" stroke="url(#goldHelix)" stroke-width="1.8" stroke-dasharray="2 1.5" opacity="0.6" />

    <line x1="43.5" y1="30" x2="56.5" y2="30" stroke="url(#goldHelix)" stroke-width="1.6" stroke-linecap="round" />
    <line x1="44" y1="36" x2="56" y2="36" stroke="url(#goldHelix)" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="50" cy="41" r="1.3" fill="#FFFBEB" />
    <line x1="44" y1="46" x2="56" y2="46" stroke="url(#goldHelix)" stroke-width="1.6" stroke-linecap="round" />
    <line x1="43.5" y1="52" x2="56.5" y2="52" stroke="url(#goldHelix)" stroke-width="1.6" stroke-linecap="round" />
    <line x1="44" y1="58" x2="56" y2="58" stroke="url(#goldHelix)" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="50" cy="63" r="1.3" fill="#FFFBEB" />
    <line x1="44" y1="68" x2="56" y2="68" stroke="url(#goldHelix)" stroke-width="1.6" stroke-linecap="round" />
    <line x1="43.5" y1="74" x2="56.5" y2="74" stroke="url(#goldHelix)" stroke-width="1.6" stroke-linecap="round" />

    <path
      d="M 50 25 C 38 29, 38 37, 50 41 C 62 45, 62 53, 50 57 C 38 61, 38 69, 50 73 C 58 75.5, 58 80, 50 83"
      fill="none"
      stroke="url(#goldHelix)"
      stroke-width="2.6"
      stroke-linecap="round"
    />

    <path
      d="M 50 25 C 62 29, 62 37, 50 41 C 38 45, 38 53, 50 57 C 62 61, 62 69, 50 73 C 42 75.5, 42 80, 50 83"
      fill="none"
      stroke="url(#goldHelix)"
      stroke-width="2.6"
      stroke-linecap="round"
    />
  </g>

  <!-- Outer Rounded Hexagon Stroke -->
  <path
    d="M 50 5.5 Q 53 7 83.5 24.5 Q 87 26.5 87 31 L 87 69 Q 87 73.5 83.5 75.5 L 53 93 Q 50 94.5 47 93 L 16.5 75.5 Q 13 73.5 13 69 L 13 31 Q 13 26.5 16.5 24.5 L 47 7 Q 50 5.5 50 5.5 Z"
    fill="none"
    stroke="url(#goldHexOuter)"
    stroke-width="4"
    stroke-linejoin="round"
    filter="url(#goldGlow)"
  />

  <path
    d="M 50 9 Q 52.5 10.5 80.5 26.5 Q 83.5 28 83.5 32 L 83.5 68 Q 83.5 72 80.5 73.5 L 52.5 89.5 Q 50 91 47.5 89.5 L 19.5 73.5 Q 16.5 72 16.5 68 L 16.5 32 Q 16.5 28 19.5 26.5 L 47.5 10.5 Q 50 9 50 9 Z"
    fill="none"
    stroke="url(#goldHexInner)"
    stroke-width="1.2"
    opacity="0.85"
  />
</svg>
